<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:fragment="clasesAsignadas">
    <h3 class="mb-4 text-titulo fw-bold">📋 Agenda de Sesiones Reales</h3>

    <!-- Tabla de sesiones -->
    <div class="table-responsive shadow-sm rounded" th:if="${!#lists.isEmpty(sesiones)}">
        <table class="table table-hover align-middle bg-white">
            <thead class="nav-bg text-white">
                <tr>
                    <th>Fecha</th>
                    <th>Día</th>
                    <th>Hora</th>
                    <th>Clase</th>
                    <th>Alumnos</th>
                    <th class="text-center">Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reserva : ${sesiones}">
                    <td class="fw-bold text-dark" th:text="${#temporals.format(reserva.fechaClase, 'dd/MM/yyyy')}"></td>
                    <td th:text="${reserva.horario.diaSemana}"></td>
                    <td>
                        <span class="badge border text-dark fw-normal" 
                              th:text="${#temporals.format(reserva.horario.horarioInicio,'HH:mm')} + ' - ' + ${#temporals.format(reserva.horario.horarioFin,'HH:mm')}">
                        </span>
                    </td>
                    <td class="fw-bold" th:text="${reserva.horario.clase.nombre}"></td>
                    <td>
                        <span class="badge bg-urbanfit">
                            <span th:text="${#numbers.formatInteger(1,2)}">01</span> / 
                            <span th:text="${reserva.horario.clase.capacidad}">14</span>
                        </span>
                    </td>
                    <td class="text-center">
                        <!-- Botón Ver alumnos -->
                        <a th:href="@{/monitor/alumnos(claseId=${reserva.horario.clase.id}, fecha=${reserva.fechaClase})}" 
                           class="btn btn-sm btn-urbanfit px-3">
                            Ver alumnos
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje cuando no hay sesiones -->
    <div th:if="${#lists.isEmpty(sesiones)}" class="alert border-warning text-center bg-white shadow-sm mt-3">
        <i class="bi bi-info-circle me-2"></i> No hay sesiones con reservas para mostrar.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
