<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>

<div th:fragment="estadisticas">

    <h4 class="text-titulo mb-4">Estadísticas del gimnasio</h4>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Total usuarios</h6>
                    <h2 class="card-title" th:text="${totalUsuarios}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Total clases</h6>
                    <h2 class="card-title" th:text="${totalClases}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Total monitores</h6>
                    <h2 class="card-title" th:text="${totalMonitores}">0</h2>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
